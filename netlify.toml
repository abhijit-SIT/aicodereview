[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# ─────────────────────────────────────────────────────────────────
# Netlify API Proxy (Zero-CORS setup)
# Once you deploy the Spring Boot backend to Render, Railway, or Fly.io,
# uncomment the redirect block below and replace with your backend URL:
# ─────────────────────────────────────────────────────────────────
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-app.onrender.com/api/:splat"
#   status = 200
#   force = true
